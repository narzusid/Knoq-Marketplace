<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Skills - Knoq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F4F6F9] text-[#0A192F] font-sans flex flex-col min-h-screen">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        function ExploreApp() {
            const [skills, setSkills] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [selectedCategory, setSelectedCategory] = React.useState('All');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [currentUser, setCurrentUser] = React.useState(null);

            React.useEffect(() => {
                const savedUser = localStorage.getItem('knoq_user');
                if (savedUser) {
                    setCurrentUser(JSON.parse(savedUser));
                }

                fetch('http://localhost:5000/api/skills')
                    .then(res => res.json())
                    .then(data => {
                        setSkills(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('Error fetching skills:', err);
                        setLoading(false);
                    });
            }, []);

            const categories = ['All', 'Computer Science', 'Programming', 'Design', 'Languages', 'Marketing'];
            
            // ক্যাটাগরি এবং সার্চ কুয়েরি ফিল্টারিং
            const filteredSkills = skills.filter(s => {
                const matchesCategory = selectedCategory === 'All' || s.category === selectedCategory;
                const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      s.teach.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      s.learn.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            const handleRequestExchange = (skill) => {
                if (!currentUser) {
                    alert("Please log in first to request an exchange!");
                    window.location.href = 'signup.html';
                    return;
                }
                if (currentUser.name === skill.name) {
                    alert("You cannot request an exchange with your own listing!");
                    return;
                }
                window.location.href = `messages.html?user=${encodeURIComponent(skill.name)}`;
            };

            const handleLogout = () => {
                localStorage.removeItem('knoq_user');
                setCurrentUser(null);
                window.location.href = 'index.html';
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Navigation Bar */}
                    <nav className="bg-white/90 backdrop-blur-md border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                        <a href="index.html" className="flex items-center cursor-pointer select-none">
                            <span className="text-2xl font-black tracking-tight text-[#0A192F]">Kn</span>
                            <span className="text-2xl font-black tracking-tight text-[#38BDF8] mx-0.5">o</span>
                            <span className="text-2xl font-black tracking-tight text-[#0A192F]">q</span>
                        </a>
                        <div className="flex items-center gap-6 font-medium text-sm text-slate-600">
                            <a href="index.html" className="hover:text-[#0A192F] transition">Home</a>
                            <a href="explore.html" className="text-[#0A192F] font-bold">Explore Skills</a>
                            <a href="dashboard.html" className="hover:text-[#0A192F] transition">Dashboard</a>
                            <a href="messages.html" className="hover:text-[#0A192F] transition">Messages</a>

                            {currentUser ? (
                                <div className="flex items-center gap-4">
                                    <a href="dashboard.html" className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs">
                                        👤 {currentUser.name}
                                    </a>
                                    <button onClick={handleLogout} className="text-xs font-bold text-rose-600 hover:underline">
                                        Log Out
                                    </button>
                                </div>
                            ) : (
                                <a href="signup.html" className="bg-[#0284C7] hover:bg-[#0369A1] text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition">Sign Up</a>
                            )}
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="px-8 py-12 max-w-7xl mx-auto w-full flex-1">
                        <div className="mb-8 text-center">
                            <h2 className="text-3xl font-black text-[#0A192F] mb-2">Explore Available Skills</h2>
                            <p className="text-slate-600 mb-6">Discover expert mentors ready to exchange knowledge.</p>
                            
                            {/* সার্চ বার ইনপুট */}
                            <div className="max-w-md mx-auto mb-6">
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="🔍 Search by mentor name or skill (e.g. React, OS)..." 
                                    className="w-full px-4 py-3 border border-slate-200 rounded-2xl text-sm shadow-sm focus:outline-none focus:border-[#0284C7] bg-white"
                                />
                            </div>

                            <div className="flex flex-wrap justify-center gap-2">
                                {categories.map(cat => (
                                    <button 
                                        key={cat} 
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${selectedCategory === cat ? 'bg-[#0284C7] text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {loading ? (
                            <div className="text-center py-20 text-slate-500 font-medium">Loading marketplace listings...</div>
                        ) : filteredSkills.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-slate-200">
                                <p className="text-slate-500 text-sm">No skills found matching your search.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredSkills.map((skill, index) => (
                                    <div key={index} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center gap-4 mb-4">
                                                <img src={skill.avatar} alt={skill.name} className="w-14 h-14 rounded-full object-cover border-2 border-sky-100" />
                                                <div>
                                                    <h4 className="font-bold text-lg text-[#0A192F]">{skill.name}</h4>
                                                    <p className="text-xs font-semibold text-[#0284C7] uppercase tracking-wide">{skill.role}</p>
                                                </div>
                                            </div>
                                            <p className="text-slate-600 text-sm mb-4 line-clamp-2">{skill.bio}</p>
                                            
                                            <div className="bg-slate-50 p-3 rounded-xl mb-4 space-y-1.5 text-sm">
                                                <p><strong className="text-[#0A192F]">Teaches:</strong> <span className="text-slate-700">{skill.teach}</span></p>
                                                <p><strong className="text-[#0A192F]">Wants to Learn:</strong> <span className="text-slate-700">{skill.learn}</span></p>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                                            <span className="text-xs font-bold bg-sky-50 text-sky-700 px-3 py-1.5 rounded-lg">⭐ {skill.rating} ({skill.reviews} reviews)</span>
                                            <button onClick={() => handleRequestExchange(skill)} className="bg-[#0A192F] hover:bg-[#1E293B] text-white text-sm font-bold px-4 py-2 rounded-xl transition">
                                                Request
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-[#0A192F] text-slate-300 py-12 px-8 mt-20 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                            <div>
                                <div className="flex items-center cursor-pointer select-none mb-4">
                                    <span className="text-2xl font-black tracking-tight text-white">Kn</span>
                                    <span className="text-2xl font-black tracking-tight text-[#38BDF8] mx-0.5">o</span>
                                    <span className="text-2xl font-black tracking-tight text-white">q</span>
                                </div>
                                <p className="text-sm text-slate-400">The premier credit-based peer-to-peer skill exchange marketplace.</p>
                            </div>
                            <div>
                                <h4 className="font-bold text-white mb-3 text-sm uppercase tracking-wider">Marketplace</h4>
                                <ul className="space-y-2 text-sm text-slate-400">
                                    <li><a href="explore.html" className="hover:text-white transition">Explore Skills</a></li>
                                    <li><a href="dashboard.html" className="hover:text-white transition">Credit System</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold text-white mb-3 text-sm uppercase tracking-wider">Account</h4>
                                <ul className="space-y-2 text-sm text-slate-400">
                                    <li><a href="signup.html" className="hover:text-white transition">Sign Up</a></li>
                                    <li><a href="dashboard.html" className="hover:text-white transition">My Dashboard</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold text-white mb-3 text-sm uppercase tracking-wider">Support</h4>
                                <p className="text-sm text-slate-400 mb-2">Need help?</p>
                                <span className="text-xs font-bold text-[#38BDF8]">support@knoq-marketplace.com</span>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
                            © 2026 Knoq Marketplace. All rights reserved.
                        </div>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<ExploreApp />);
    </script>
</body>
</html>
