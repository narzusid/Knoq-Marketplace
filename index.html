<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knoq - Skill Exchange Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              oceanDark: '#0A192F',  
              cyanAccent: '#0284C7', 
              skyLetter: '#38BDF8'   
            }
          }
        }
      }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F4F6F9] text-[#0A192F] font-sans flex flex-col min-h-screen">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        function HomeApp() {
            const [currentUser, setCurrentUser] = React.useState(null);

            React.useEffect(() => {
                const savedUser = localStorage.getItem('knoq_user');
                if (savedUser) {
                    setCurrentUser(JSON.parse(savedUser));
                }
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('knoq_user');
                setCurrentUser(null);
                window.location.reload();
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Navigation Bar */}
                        <nav className="bg-white/90 backdrop-blur-md border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                            <a href="index.html" className="flex items-center cursor-pointer select-none">
                                <span className="text-2xl font-black tracking-tight text-oceanDark">Kn</span>
                                <span className="text-2xl font-black tracking-tight text-skyLetter mx-0.5">o</span>
                                <span className="text-2xl font-black tracking-tight text-oceanDark">q</span>
                            </a>
                            
                            <div className="flex items-center gap-6 font-medium text-sm text-slate-600">
                                <a href="index.html" className="text-oceanDark font-bold">Home</a>
                                <a href="explore.html" className="hover:text-oceanDark transition">Explore Skills</a>
                                <a href="dashboard.html" className="hover:text-oceanDark transition">Dashboard</a>
                                <a href="messages.html" className="hover:text-oceanDark transition">Messages</a>

                                {currentUser ? (
                                    <div className="flex items-center gap-4">
                                        <a href="dashboard.html" className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs">
                                            👤 {currentUser.name}
                                        </a>
                                        <button onClick={handleLogout} className="text-xs font-bold text-rose-600 hover:underline">
                                            Log Out
                                        </button>
                                    </div>
                                ) : (
                                    <a href="signup.html" className="bg-cyanAccent hover:bg-[#0369A1] text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition">Sign Up</a>
                                )}
                            </div>
                        </nav>

                        {/* Home Hero Section Only */}
                        <header className="flex flex-col justify-center items-center text-center px-4 py-28 bg-gradient-to-b from-sky-50/50 via-[#F4F6F9] to-[#F4F6F9]">
                            <div className="inline-block bg-sky-100 border border-sky-200 text-sky-800 text-xs font-bold px-4 py-1.5 rounded-full mb-6 uppercase tracking-wider shadow-sm">
                                ✨ Secure Peer-to-Peer Skill Exchange Marketplace
                            </div>
                            <h1 className="text-5xl md:text-7xl font-black max-w-4xl mb-6 tracking-tight leading-tight text-oceanDark">
                                Exchange Skills, <span className="text-cyanAccent">Learn Without Money</span>
                            </h1>
                            <p className="text-lg text-slate-600 max-w-2xl mb-10 leading-relaxed">
                                Knoq connects students and mentors globally with secure credit wallets, live notifications, and reviews.
                            </p>
                            <div className="flex gap-4">
                                <a href="explore.html" className="bg-cyanAccent hover:bg-[#0369A1] text-white font-bold px-8 py-4 rounded-2xl shadow-xl transition">
                                    Explore Skills Now
                                </a>
                                <a href="signup.html" className="bg-white border border-slate-300 hover:bg-slate-50 font-semibold px-8 py-4 rounded-2xl text-slate-700 transition">
                                    Create Free Account
                                </a>
                            </div>
                        </header>
                    </div>

                    {/* Footer */}
                    <footer className="bg-oceanDark text-slate-300 py-12 px-8 mt-20 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                            <div>
                                <a href="index.html" className="flex items-center cursor-pointer select-none mb-4">
                                    <span className="text-2xl font-black tracking-tight text-white">Kn</span>
                                    <span className="text-2xl font-black tracking-tight text-skyLetter mx-0.5">o</span>
                                    <span className="text-2xl font-black tracking-tight text-white">q</span>
                                </a>
                                <p className="text-sm text-slate-400">
                                    The premier credit-based peer-to-peer skill exchange marketplace for students and global mentors.
                                </p>
                            </div>
                            <div>
                                <h4 className="font-bold text-white mb-3 text-sm uppercase tracking-wider">Marketplace</h4>
                                <ul className="space-y-2 text-sm text-slate-400">
                                    <li><a href="explore.html" className="hover:text-white transition">Explore Skills</a></li>
                                    <li><a href="dashboard.html" className="hover:text-white transition">Credit System</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold text-white mb-3 text-sm uppercase tracking-wider">Account</h4>
                                <ul className="space-y-2 text-sm text-slate-400">
                                    <li><a href="signup.html" className="hover:text-white transition">Sign Up</a></li>
                                    <li><a href="dashboard.html" className="hover:text-white transition">My Dashboard</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold text-white mb-3 text-sm uppercase tracking-wider">Support</h4>
                                <p className="text-sm text-slate-400 mb-2">Need help?</p>
                                <span className="text-xs font-bold text-skyLetter">support@knoq-marketplace.com</span>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
                            © 2026 Knoq Marketplace. All rights reserved.
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<HomeApp />);
    </script>
</body>
</html>
