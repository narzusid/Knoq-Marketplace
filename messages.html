<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Knoq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F4F6F9] text-[#0A192F] font-sans flex flex-col h-screen overflow-hidden">
    <div id="root" class="flex-1 flex flex-col h-full"></div>

    <script type="text/babel">
        function MessagesApp() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [messages, setMessages] = React.useState([]);
            const [activeChatUser, setActiveChatUser] = React.useState("");
            const [inputText, setInputText] = React.useState("");
            const [exchangeRequests, setExchangeRequests] = React.useState([]);
            
            // Sync with logged-in user from localStorage
            React.useEffect(() => {
                const savedUser = localStorage.getItem('knoq_user');
                if (savedUser) {
                    const parsedUser = JSON.parse(savedUser);
                    if (parsedUser && parsedUser.name) {
                        setCurrentUser(parsedUser.name);
                    }
                }

                const params = new URLSearchParams(window.location.search);
                const targetUser = params.get('user');
                if (targetUser) {
                    setActiveChatUser(targetUser);
                }
            }, []);

            // Fetch Messages and Requests periodically for real-time feel
            const fetchData = () => {
                fetch('http://localhost:5000/api/messages')
                    .then(res => res.json())
                    .then(data => setMessages(data))
                    .catch(err => console.error('Error fetching messages:', err));

                fetch('http://localhost:5000/api/requests')
                    .then(res => res.json())
                    .then(data => setExchangeRequests(data))
                    .catch(err => console.error('Error fetching requests:', err));
            };

            React.useEffect(() => {
                if (currentUser) {
                    fetchData();
                    const interval = setInterval(fetchData, 3000);
                    return () => clearInterval(interval);
                }
            }, [currentUser]);

            // Extract unique chat participants
            const chatUsers = currentUser ? Array.from(new Set([
                ...messages.map(m => m.sender === currentUser ? m.receiver : m.sender),
                ...exchangeRequests.map(r => r.sender === currentUser ? r.receiver : r.sender),
                ...(activeChatUser ? [activeChatUser] : [])
            ])).filter(u => u && u !== currentUser) : [];

            const activeMessages = messages.filter(
                m => (m.sender === currentUser && m.receiver === activeChatUser) ||
                     (m.sender === activeChatUser && m.receiver === currentUser)
            );

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!inputText.trim() || !activeChatUser) return;

                const payload = {
                    sender: currentUser,
                    receiver: activeChatUser,
                    text: inputText
                };

                fetch('http://localhost:5000/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    setMessages(prev => [...prev, data.data]);
                    setInputText("");
                })
                .catch(err => console.error('Error sending message:', err));
            };

            const handleLogout = () => {
                localStorage.removeItem('knoq_user');
                window.location.href = 'index.html';
            };

            return (
                <div className="flex flex-col h-screen">
                    {/* Navigation Bar */}
                    <nav className="bg-white/90 backdrop-blur-md border-b border-slate-200 px-8 py-3 flex justify-between items-center z-50 shadow-sm shrink-0">
                        <a href="index.html" className="flex items-center cursor-pointer select-none">
                            <span className="text-2xl font-black tracking-tight text-[#0A192F]">Kn</span>
                            <span className="text-2xl font-black tracking-tight text-[#38BDF8] mx-0.5">o</span>
                            <span className="text-2xl font-black tracking-tight text-[#0A192F]">q</span>
                        </a>
                        
                        <div className="flex items-center gap-6 font-medium text-sm text-slate-600">
                            <a href="index.html" className="hover:text-[#0A192F] transition">Home</a>
                            <a href="explore.html" className="hover:text-[#0A192F] transition">Explore Skills</a>
                            <a href="dashboard.html" className="hover:text-[#0A192F] transition">Dashboard</a>
                            <a href="messages.html" className="text-[#0A192F] font-bold">Messages</a>

                            {currentUser ? (
                                <div className="flex items-center gap-4">
                                    <span className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs">
                                        👤 {currentUser}
                                    </span>
                                    <button onClick={handleLogout} className="text-xs font-bold text-rose-600 hover:underline">
                                        Log Out
                                    </button>
                                </div>
                            ) : (
                                <a href="signup.html" className="bg-[#0284C7] hover:bg-[#0369A1] text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition">Sign Up</a>
                            )}
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    {currentUser ? (
                        <div className="flex flex-1 overflow-hidden max-w-7xl mx-auto w-full p-4 gap-4">
                            {/* Sidebar - Conversation List */}
                            <div className="w-1/3 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
                                <div className="p-4 border-b border-slate-100">
                                    <h3 className="font-black text-lg text-[#0A192F]">Conversations</h3>
                                    <p className="text-xs text-slate-400">Select a chat to start messaging</p>
                                </div>
                                <div className="flex-1 overflow-y-auto divide-y divide-slate-50">
                                    {chatUsers.length === 0 ? (
                                        <div className="p-6 text-center text-slate-400 text-sm">No conversations yet. Request an exchange from the Explore page!</div>
                                    ) : (
                                        chatUsers.map((user, idx) => (
                                            <div 
                                                key={idx}
                                                onClick={() => setActiveChatUser(user)}
                                                className={`p-4 flex items-center gap-3 cursor-pointer transition ${activeChatUser === user ? 'bg-sky-50/80 border-l-4 border-[#0284C7]' : 'hover:bg-slate-50'}`}
                                            >
                                                <div className="w-10 h-10 rounded-full bg-[#0A192F] text-white flex items-center justify-center font-bold text-sm shadow-inner">
                                                    {user.charAt(0).toUpperCase()}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <h4 className="font-bold text-sm text-[#0A192F] truncate">{user}</h4>
                                                    <p className="text-xs text-slate-500 truncate">Click to view messages</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Chat Box Area */}
                            <div className="flex-2 flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
                                {activeChatUser ? (
                                    <>
                                        {/* Chat Header */}
                                        <div className="p-4 border-b border-slate-100 flex items-center gap-3 bg-slate-50/50">
                                            <div className="w-10 h-10 rounded-full bg-[#0284C7] text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                                {activeChatUser.charAt(0).toUpperCase()}
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-base text-[#0A192F]">{activeChatUser}</h4>
                                                <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>
                                                <span className="text-xs text-slate-500 font-medium">Active Exchange Partner</span>
                                            </div>
                                        </div>

                                        {/* Messages List */}
                                        <div className="flex-1 p-6 overflow-y-auto space-y-4 bg-[#FAFBFC]">
                                            {activeMessages.length === 0 ? (
                                                <div className="h-full flex items-center justify-center text-slate-400 text-sm">
                                                    No messages with {activeChatUser} yet. Say hello! 👋
                                                </div>
                                            ) : (
                                                activeMessages.map((msg, index) => {
                                                    const isMe = msg.sender === currentUser;
                                                    return (
                                                        <div key={index} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                                            <div className={`max-w-md px-4 py-3 rounded-2xl text-sm shadow-sm ${isMe ? 'bg-[#0284C7] text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}`}>
                                                                <p>{msg.text}</p>
                                                                <span className={`block text-[10px] mt-1 text-right ${isMe ? 'text-sky-100' : 'text-slate-400'}`}>
                                                                    {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>

                                        {/* Message Input Form */}
                                        <form onSubmit={handleSendMessage} className="p-4 border-t border-slate-100 bg-white flex gap-3 items-center">
                                            <input 
                                                type="text" 
                                                placeholder="Type your message here..." 
                                                value={inputText}
                                                onChange={(e) => setInputText(e.target.value)}
                                                className="flex-1 px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0284C7] transition"
                                            />
                                            <button type="submit" className="bg-[#0A192F] hover:bg-[#1E293B] text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2">
                                                Send
                                            </button>
                                        </form>
                                    </>
                                ) : (
                                    <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
                                        <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-2xl mb-3 text-slate-500 font-bold">💬</div>
                                        <h4 className="font-bold text-lg text-[#0A192F] mb-1">Your Messages</h4>
                                        <p className="text-sm max-w-sm">Choose a conversation from the sidebar or click "Request" on any mentor profile in the Explore page to start chatting.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="flex-1 flex justify-center items-center p-4">
                            <div className="text-center py-20 bg-white rounded-2xl border border-slate-200 p-8 max-w-lg mx-auto shadow-sm my-12 w-full">
                                <h3 className="text-2xl font-black text-[#0A192F] mb-2">Access Your Messages</h3>
                                <p className="text-slate-600 text-sm mb-6">Please log in to chat with your skill exchange partners.</p>
                                <a href="signup.html" className="bg-[#0284C7] text-white font-bold px-6 py-3 rounded-xl transition text-sm inline-block">
                                    Log In / Register Now
                                </a>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MessagesApp />);
    </script>
</body>
</html>
